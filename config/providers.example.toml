# Copy outside the checkout and supply actual values. No model is contacted by default.
# Model labels/settings are public; URLs/deployment strings/credentials are local configuration.
[models."grok-4.7"]
kind = "subscription"
label = "Grok 4.7"
context_window = 500000
auth_file = "/run/secrets/operator-auth.json"

[models."grok-4.6"]
kind = "subscription"
label = "Grok 4.6"
context_window = 500000
auth_file = "/run/secrets/operator-auth.json"

[models."gpt-6-luna"]
kind = "api"
label = "GPT-6 Luna"
model = "replace-with-deployment-id"
api_backend = "responses"
base_url = "https://provider.example.invalid/v1"
credential_file = "/run/secrets/provider-key"
auth_header = "Authorization"
auth_prefix = "Bearer "
context_window = 1050000
max_completion_tokens = 8192
pacing_group = "gpt-6-luna"

[models."claude-sonnet-5"]
kind = "api"
label = "Claude Sonnet 5"
model = "replace-with-deployment-id"
api_backend = "chat_completions"
base_url = "https://provider.example.invalid/v1"
credential_file = "/run/secrets/provider-key"
context_window = 1000000
max_completion_tokens = 32000
pacing_group = "claude"
# For services requiring max_completion_tokens rather than max_tokens:
# completion_token_field = "max_completion_tokens"

