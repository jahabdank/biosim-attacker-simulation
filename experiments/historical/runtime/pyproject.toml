[project]
name = "biosim-historical-runtime"
version = "0.1.0"
description = "Inspect-shaped HTTP wrapper around stock NASA BioSim. Not a BioSim fork."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
